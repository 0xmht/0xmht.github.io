<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0xmht — Dil Seçimi / Language</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .lang-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin: 2rem 0;
        }
        .lang-btn {
            display: block;
            padding: 1.2rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.2rem;
            transition: 0.25s;
        }
        .lang-btn:hover {
            background: var(--surface-hover);
            transform: translateY(-2px);
        }
        .lang-btn small {
            display: block;
            font-weight: 400;
            color: var(--muted);
            font-size: 0.85rem;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<main style="max-width: 500px; text-align: center;">
    <section class="card">
        <h1>🌐 0xmht</h1>
        <p style="margin-bottom: 2rem;">Select your language / Dilini seç</p>

        <div class="lang-grid">
            <a href="/tr/" class="lang-btn">
                🇹🇷 Türkçe
                <small>Ana dilim</small>
            </a>
            <a href="/en/" class="lang-btn">
                🇬🇧 English
                <small>My second language</small>
            </a>
        </div>

        <p style="font-size: 0.8rem; color: var(--muted); margin-top: 2rem;">
            © 2026 0xmht — open source, open mind.
        </p>
    </section>
</main>

</body>
</html>
